<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landing Page</title>
      <link rel="icon" type="image/x-icon" href="resources/images/icons/mvgl.ico">
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="resources/styles/landing_page.css" rel="stylesheet">

  <body class="bg-dark">
    <nav class="navbar navbar-expand bg-secondary">
        <div class="container-fluid">
            <!-- Nav Headers -->
            <ul class="nav">
                <li><a class="nav-link nav-font">Console</a></li>
                <li><a class="nav-link nav-font">Genre</a></li>
                <li><a class="nav-link nav-font">Rating</a></li>
                <li><a class="nav-link nav-font">Favourites</a></li>
            </ul>

            <form class="form-inline my-2 my-lg-0 form-inline">

            <ul class="navbar-nav"></ul>
            <a>

            </a>

    <div class="container mt-5">
        <a class="custom-font-1">Recent release</a>
        <hr class="border border-1 opacity-1">
        <div class="row  text-center">
            <div class="col">
                <div id="gameCarousel1" class="carousel slide" data-ride="carousel">
                    <div class="card">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/EldenRing.webp" alt="">
                            </div>
                            <div class="carousel-item">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/FF7Remake.webp">
                            </div>
                            <div class="carousel-item">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/AssassinsCreedShadows.webp">
                            </div>
                            <div class="carousel-item">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/ZeldaBreathOfWild.avif">
                            </div>
                            <div class="carousel-item">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/FF7Rebirth.webp">
                            </div>
                            <div class="carousel-item">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/ZeldaTears.webp">
                            </div>
                            <div class="carousel-item">
                                <img class="w-100 img-thumbnail" src="resources/images/banners/Skyrim.webp">
                            </div>
                        </div>
                    </div>
                    <a class="carousel-control-prev" data-bs-target="#gameCarousel1" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </a>
                    <a class="carousel-control-next" data-bs-target="#gameCarousel1" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="container text-center mt-5">
        <div class="text-start">
            <a class="custom-font-2">Trending</a>
        </div>
            <hr class="border border-1 opacity-1">
        <div class="row">
            <div class="col">
                <a>
                    <img src="resources/images/covers/AssasinsCreedShadowsCover.avif" class="img-thumbnail">
                </a>
            </div>
            <div class="col">
                <a>
                    <img src="resources/images/covers/EldenRingCover.webp" class="img-thumbnail">
                </a>
            </div>
            <div class="col">
                <a>
                    <img src="resources/images/covers/SkyrimCover.webp" class="img-thumbnail">
                </a>
            </div>
            <div class="col">
                <a>
                    <img src="resources/images/covers/FF7RemakeCover.webp" class="img-thumbnail">
                </a>
            </div>
            <div class="col">
                <a>
                    <img src="resources/images/covers/ZeldaBreathCover.webp" class="img-thumbnail">
                </a>
            </div>
            <div class="col">
                <a>
                    <img src="resources/images/covers/FF7RebirthCover.avif" class="img-thumbnail">
                </a>
            </div>
        </div>
    </div>
    <div class="container text-center mt-5">
        <div class="card">
            <div class="row g-0">
                <div class="col">
                    <h1>News Feed</h1>
                    <br>
                    <p>This is where the news feed will go.</p>
                </div>
            </div>
        </div>
    </div>
