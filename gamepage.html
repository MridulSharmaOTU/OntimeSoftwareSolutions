<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Game List - Game Page</title>
    <link rel="icon" type="image/x-icon" href="./resources/images/icons/myvgl.ico">
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="./resources/styles/landing_page.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
      /* Additional custom styling for game detail page */
      body { background-color: #2b2b2b; color: #ccc; }
      .game-cover { max-width: 300px; }
      .game-info { background-color: #3c3c3c; border-radius: 4px; padding: 20px; }
      .info-label { font-weight: bold; color: #fff; }
      .info-value { margin-left: 5px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand">
      <div class="container-fluid navbar">
          <div class="menu-toggle" id="menu-toggle">
              <span></span>
              <span></span>
              <span></span>
          </div>
          <a style="color:rgb(48, 47, 47)" href="index.html"><i class="fa-solid fa-house" style="padding-left: 1rem; padding-right: 1rem; font-size:2rem"></i></a>
          <!-- (Navigation continues as needed...) -->
      </div>
    </nav>
    <div class="container mt-4">
      <div class="row">
        <!-- Left column: Cover image -->
        <div class="col-md-4 text-center">
          <img id="game-cover" class="img-thumbnail game-cover" src="./resources/images/covers/placeholder.jpg" alt="Game Cover">
        </div>
        <!-- Right column: Game metadata -->
        <div class="col-md-8 game-info">
          <h2 id="game-title">Loading Game Title...</h2>
          <p id="game-description">Loading game description...</p>
          <p><span class="info-label">Genre:</span> <span id="game-genre">N/A</span></p>
          <p><span class="info-label">Release Date:</span> <span id="game-release-date">N/A</span></p>
          <p><span class="info-label">Platform:</span> <span id="game-platform">N/A</span></p>
          <p><span class="info-label">Developer/Publisher:</span> <span id="game-dev-pub">N/A</span></p>
          <p><span class="info-label">Age:</span> <span id="game-age">N/A</span></p>
          <p><span class="info-label">Rating:</span> <span id="game-rating">N/A</span></p>
          <p><span class="info-label">Avg. Completion Time:</span> <span id="game-completion-time">N/A</span></p>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    <!-- Main script for game detail page -->
    <script type="module">
      import { getGameMetadataById } from './resources/scripts/loadMetadata.js';

      // Get the game ID from the query parameter (?id=...)
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get('id');

      if (!gameId) {
        document.getElementById('game-title').textContent = 'No game ID provided.';
      } else {
        // Load the game metadata using the provided function
        getGameMetadataById(gameId).then(gameData => {
          if (!gameData) {
            document.getElementById('game-title').textContent = 'Game not found.';
            document.getElementById('game-description').textContent = '';
            return;
          }

          document.title = gameData.Title.replace(/^"|"$/g, '');

          document.getElementById('game-title').textContent = gameData.Title;
          document.getElementById('game-description').textContent = gameData.Description;
          document.getElementById('game-genre').textContent = gameData.Genre || 'N/A';
          document.getElementById('game-release-date').textContent = gameData['Release Date'] || 'N/A';
          document.getElementById('game-platform').textContent = gameData.Platform || 'N/A';
          document.getElementById('game-dev-pub').textContent = gameData['Developer/Publisher'] || 'N/A';
          document.getElementById('game-age').textContent = gameData.Age || 'N/A';
          document.getElementById('game-rating').textContent = gameData.Rating || 'N/A';
          document.getElementById('game-completion-time').textContent = gameData['Average Completion Time'] || 'N/A';

          // Build the cover image source based on the game ID
          const coverImg = document.getElementById('game-cover');
          coverImg.src = './resources/images/games/' + gameId + '/banner.webp';
          coverImg.alt = `Cover image for ${gameData.Title}`;
        });
      }
    </script>
  </body>
</html>
