<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="icon" type="image/x-icon" href="./resources/images/icons/myvgl.ico">
    <!-- Stylesheets -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link href="./resources/styles/results_page.css" rel="stylesheet">
    <link href="./resources/styles/navbar.css" rel="stylesheet">
    <link href="./resources/styles/images.css" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
  </head>
  <body class="bg-dark">
    <!-- Navbar -->
    <navbar-component></navbar-component>

    <!-- Search Results & Sort Dropdown -->
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="heading-font search-results-heading mb-0">Search Results</h1>
        <!-- Sort Dropdown -->
        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Sort
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item sort-option" data-sort="t" href="?sort=t">Title ↑</a></li>
            <li><a class="dropdown-item sort-option" data-sort="tr" href="?sort=tr">Title ↓</a></li>
            <li><a class="dropdown-item sort-option" data-sort="u" href="?sort=u">Rating ↑</a></li>
            <li><a class="dropdown-item sort-option" data-sort="ur" href="?sort=ur">Rating ↓</a></li>
            <li><a class="dropdown-item sort-option" data-sort="" href="?">Release Date ↑</a></li>
            <li><a class="dropdown-item sort-option" data-sort="rr" href="?sort=rr">Release Date ↓</a></li>
          </ul>
        </div>
      </div>
      <hr class="border border-1 opacity-1">
      <div class="row" id="results-container">
        <!-- Search results will be rendered here -->
      </div>
    </div>

    <!-- Bootstrap JS bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <!-- Load the navbar -->
    <script type="module" src="./resources/scripts/navbar.js"></script>

    <!-- Update dropdown links to retain search parameter -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const searchQuery = params.get("search") || "";
        const consoleParam = params.get("console") || "";
        const genreParam = params.get("genre") || "";
  
        const sortLinks = document.querySelectorAll(".sort-option");
        sortLinks.forEach(link => {
          const sortValue = link.getAttribute("data-sort"); 
          const newParams = new URLSearchParams();
          if (sortValue) newParams.set("sort", sortValue);
          if (searchQuery) newParams.set("search", searchQuery);
          if (consoleParam) newParams.set("console", consoleParam);
          if (genreParam) newParams.set("genre", genreParam);
  
          link.setAttribute("href", "?" + newParams.toString());
        });
      });
    </script>

    <!-- Main script to dynamically render search results -->
    <script type="module">
      import { searchByTitle } from "./resources/scripts/utils/search.js";
      import { sortTitle, sortRelease, sortRating, reverse } from "./resources/scripts/utils/sort.js";
      
      /**
       * Renders the search results as cards.
       * @param {Array<Object>} results - Array of game objects.
       */
      function renderResults(results) {
        const container = document.getElementById("results-container");
        container.innerHTML = "";
        results.forEach(game => {
          const col = document.createElement("div");
          col.className = "col-md-4 mb-4";
          const link = document.createElement("a");
          link.href = `game_page.html?id=${game.ID}`;
          const card = document.createElement("div");
          card.className = "card h-100 bg-light text-dark";
          const img = document.createElement("img");
          // Update the image source to load from the Node server's static route
          img.src = `http://localhost:3000/images/games/${game.ID}/cover.webp`;
          img.className = "card-img-top";
          img.alt = `${game.Title} Cover`;
          card.appendChild(img);
          const cardBody = document.createElement("div");
          cardBody.className = "card-body";
          const title = document.createElement("h5");
          title.className = "card-title";
          title.textContent = game.Title;
          cardBody.appendChild(title);
          const desc = document.createElement("p");
          desc.className = "card-text";
          desc.textContent = game.DescriptionS;
          cardBody.appendChild(desc);
          const platforms = document.createElement("p");
          platforms.className = "card-text";
          platforms.innerHTML = `<small class="text-muted">Available on: ${game.Platform}</small>`;
          cardBody.appendChild(platforms);
          card.appendChild(cardBody);
          link.appendChild(card);
          col.appendChild(link);
          container.appendChild(col);
        });
      }
      
      // Get query parameters.
      const params = new URLSearchParams(window.location.search);
      const searchQuery = params.get("search") || "";
      const sortParam = params.get("sort") || "";
      const consoleParam = params.get("console") || "";
      const genreParam = params.get("genre") || "";
      
      // Fetch all games from the Node server.
      fetch("http://localhost:3000/data")
        .then(response => response.json())
        .then(allGames => {
          let results = searchByTitle(allGames, searchQuery);
  
          if (consoleParam) {
            const consoleLower = consoleParam.toLowerCase();
            results = results.filter(game => {
              const platforms = game.Platform.toLowerCase().split('|').map(p => p.trim());
              return platforms.includes(consoleLower);
            });
          }
  
          if (genreParam) {
            const genreLower = genreParam.toLowerCase();
            results = results.filter(game => {
              const genres = game["Genre Tags"].toLowerCase().split('|').map(g => g.trim());
              return genres.includes(genreLower);
            });
          }
  
          switch (sortParam) {
            case "t":
              sortTitle(results);
              break;
            case "tr":
              sortTitle(results);
              reverse(results);
              break;
            case "u":
              sortRating(results);
              break;
            case "ur":
              sortRating(results);
              reverse(results);
              break;
            case "rr":
              sortRelease(results);
              reverse(results);
              break;
            default:
              sortRelease(results);
              break;
          }
  
          renderResults(results);
        })
        .catch(error => {
          console.error("Error loading metadata:", error);
        });
    </script>
  </body>
</html>
