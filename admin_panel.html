<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <!-- Link to your CSS file -->
  <link rel="stylesheet" href="resources/styles/admin_panel.css" />
</head>
<body>
  <div class="container">
    <h1 id="pageTitle">Game Page - Add Game</h1>
    <img id="backIcon" src="resources/images/icons/arrow-return-left.svg" href="./index.html" alt="Back" />

    <form id="gameForm" class="game-form">
      <!-- Title -->
      <div class="form-row">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" placeholder="Title" />
      </div>
      
      <!-- Short Description -->
      <div class="form-row">
        <label for="descriptionS">Description (Short):</label>
        <textarea id="descriptionS" name="descriptionS" placeholder="Short description"></textarea>
      </div>
      
      <!-- Long Description -->
      <div class="form-row">
        <label for="descriptionL">Description (Long):</label>
        <textarea id="descriptionL" name="descriptionL" placeholder="Long description"></textarea>
      </div>
      
      <!-- Genre Checkboxes -->
      <div class="form-row">
        <span>Genre:</span>
        <label><input type="checkbox" name="genre" value="Action" /> Action</label>
        <label><input type="checkbox" name="genre" value="Adventure" /> Adventure</label>
        <label><input type="checkbox" name="genre" value="RPG" /> RPG</label>
        <label><input type="checkbox" name="genre" value="Platformer" /> Platformer</label>
        <label><input type="checkbox" name="genre" value="Simulation" /> Simulation</label>
        <label><input type="checkbox" name="genre" value="Shooter" /> Shooter</label>
        <label><input type="checkbox" name="genre" value="Horror" /> Horror</label>
        <label><input type="checkbox" name="genre" value="Racing" /> Racing</label>
      </div>
      
      <!-- Console Checkboxes -->
      <div class="form-row">
        <span>Console:</span>
        <label><input type="checkbox" name="console" value="Xbox" /> Xbox</label>
        <label><input type="checkbox" name="console" value="PlayStation" /> PlayStation</label>
        <label><input type="checkbox" name="console" value="Nintendo" /> Nintendo</label>
        <label><input type="checkbox" name="console" value="PC" /> PC</label>
      </div>
      
      <!-- Publisher/Developer -->
      <div class="form-row">
        <label for="devPub">Publisher/Developer:</label>
        <input type="text" id="devPub" name="devPub" placeholder="Publisher/Developer" />
      </div>
      
      <!-- Age Rating -->
      <div class="form-row">
        <label for="ageRating">Age Rating:</label>
        <input type="text" id="ageRating" name="ageRating" placeholder="ESRB Rating" />
      </div>
      
      <!-- Rating -->
      <div class="form-row">
        <label for="rating">Rating:</label>
        <input type="text" id="rating" name="rating" placeholder="0-5 (including float values)" />
      </div>
      
      <!-- Completion Time -->
      <div class="form-row">
        <label for="completionTime">Completion Time:</label>
        <input type="text" id="completionTime" name="completionTime" placeholder="in Hours" />
      </div>
      
      <!-- Release Date (with calendar) -->
      <div class="form-row">
        <label for="releaseDate">Release Date:</label>
        <input type="date" id="releaseDate" name="releaseDate" />
      </div>
      
      <!-- Trailer -->
      <div class="form-row">
        <label for="trailer">Trailer:</label>
        <input type="text" id="trailer" name="trailer" placeholder="https://www.youtube.com/embed/" />
      </div>
      
      <!-- Cover -->
      <div class="form-row">
        <label for="cover">Cover:</label>
        <input type="file" id="cover" name="cover" />
      </div>
      
      <!-- Banner -->
      <div class="form-row">
        <label for="banner">Banner:</label>
        <input type="file" id="banner" name="banner" />
      </div>
      
      <!-- Screenshot 1 -->
      <div class="form-row">
        <label for="screenshot1">Screenshot 1:</label>
        <input type="file" id="screenshot1" name="screenshot1" />
      </div>
      
      <!-- Screenshot 2 -->
      <div class="form-row">
        <label for="screenshot2">Screenshot 2:</label>
        <input type="file" id="screenshot2" name="screenshot2" />
      </div>
      
      <!-- Screenshot 3 -->
      <div class="form-row">
        <label for="screenshot3">Screenshot 3:</label>
        <input type="file" id="screenshot3" name="screenshot3" />
      </div>
      
      <!-- Buttons -->
      <div class="form-row button-row">
        <button type="submit" id="updateButton">Add Game</button>
        <button type="button" id="deleteButton" class="delete-button">Delete</button>
        <!-- New button for image uploads (visible in edit mode) -->
        <button type="button" id="uploadImages" class="upload-button" style="display:none;">Upload Images</button>
      </div>
    </form>
  </div>
  <script>
    // API endpoints for CSV data and image uploads.
    const METADATA_API = "http://localhost:3000/data";
    const IMAGES_API = "http://localhost:3000/images";
  
    // Helper: returns trimmed value or null if empty.
    const valueOrNull = id => {
      const elem = document.getElementById(id);
      if (!elem) return null;
      const val = elem.value;
      return val.trim() === "" ? null : val.trim();
    };
  
    // Helper: checks if any image file inputs have a file selected.
    const hasImageFiles = () => {
      return document.getElementById("banner").files.length ||
             document.getElementById("cover").files.length ||
             document.getElementById("screenshot1").files.length ||
             document.getElementById("screenshot2").files.length ||
             document.getElementById("screenshot3").files.length;
    };
  
    // Function to upload images if present.
    async function uploadImages(gameID) {
      if (!hasImageFiles()) return; // Nothing to upload.
      const formData = new FormData();
      formData.append("id", gameID);
  
      const bannerFile = document.getElementById("banner").files[0];
      const coverFile = document.getElementById("cover").files[0];
      const ss1File = document.getElementById("screenshot1").files[0];
      const ss2File = document.getElementById("screenshot2").files[0];
      const ss3File = document.getElementById("screenshot3").files[0];
  
      if (bannerFile) formData.append("banner", bannerFile);
      if (coverFile) formData.append("cover", coverFile);
      if (ss1File) formData.append("ss1", ss1File);
      if (ss2File) formData.append("ss2", ss2File);
      if (ss3File) formData.append("ss3", ss3File);
  
      try {
        const response = await fetch(IMAGES_API, {
          method: "POST",
          body: formData
        });
        if (!response.ok) {
          console.error("Image upload failed:", await response.text());
          alert("Game saved, but image upload failed.");
        } else {
          alert("Images uploaded successfully!");
        }
      } catch (error) {
        console.error("Error uploading images:", error);
        alert("Game saved, but an error occurred during image upload.");
      }
    }
  
    const params = new URLSearchParams(window.location.search);
    const editID = params.get("editID");
    const pageTitle = document.getElementById("pageTitle");
    const updateButton = document.getElementById("updateButton");
    const deleteButton = document.getElementById("deleteButton");
    const gameForm = document.getElementById("gameForm");
  
    if (editID) {
      // Edit mode: show delete button; merge image upload with update.
      pageTitle.textContent = "Game Page - (Loading...)";
      deleteButton.style.display = "inline-block";
      updateButton.textContent = "Update";
    
      // Fetch current game data.
      fetch(METADATA_API)
        .then(response => response.json())
        .then(games => {
          const game = games.find(g => g.ID == editID);
          if (game) {
            pageTitle.textContent = "Game Page - " + game.Title;
            document.getElementById("title").placeholder = game.Title;
            document.getElementById("descriptionS").placeholder = game.DescriptionS;
            document.getElementById("descriptionL").placeholder = game.DescriptionL;
            document.getElementById("devPub").placeholder = game["Developer/Publisher"];
            document.getElementById("ageRating").placeholder = game.Age;
            document.getElementById("rating").placeholder = game.Rating;
            document.getElementById("completionTime").placeholder = game["Average Completion Time"];
            document.getElementById("trailer").placeholder = game.Trailer;
            document.getElementById("releaseDate").value = game["Release Date"];
    
            if (game["Genre Tags"]) {
              const genres = game["Genre Tags"].split("|").map(g => g.trim());
              document.querySelectorAll('input[name="genre"]').forEach(checkbox => {
                if (genres.includes(checkbox.value)) {
                  checkbox.checked = true;
                }
              });
            }
    
            if (game.Platform) {
              const consoles = game.Platform.split("|").map(c => c.trim());
              document.querySelectorAll('input[name="console"]').forEach(checkbox => {
                if (consoles.includes(checkbox.value)) {
                  checkbox.checked = true;
                }
              });
            }
          } else {
            pageTitle.textContent = "Game Page - Game not found";
          }
        })
        .catch(err => {
          console.error("Error fetching game data:", err);
          pageTitle.textContent = "Game Page - Error loading game data";
        });
    
      // On form submission in edit mode: update CSV data, then upload images if present.
      gameForm.addEventListener("submit", async e => {
        e.preventDefault();
        const payload = {
          ID: editID,
          Title: valueOrNull("title"),
          DescriptionS: valueOrNull("descriptionS"),
          DescriptionL: valueOrNull("descriptionL"),
          "Genre Tags": Array.from(document.querySelectorAll('input[name="genre"]:checked')).map(el => el.value).join("|") || null,
          "Release Date": document.getElementById("releaseDate").value.trim() || null,
          Platform: Array.from(document.querySelectorAll('input[name="console"]:checked')).map(el => el.value).join("|") || null,
          "Developer/Publisher": valueOrNull("devPub"),
          Age: valueOrNull("ageRating"),
          Rating: valueOrNull("rating"),
          "Average Completion Time": valueOrNull("completionTime"),
          Trailer: valueOrNull("trailer")
        };
    
        try {
          const response = await fetch(METADATA_API, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            // CSV updated successfully—now check for images.
            await uploadImages(editID);
            alert("Game updated successfully!");
          } else {
            alert("Failed to update game.");
          }
        } catch (error) {
          console.error("Error updating game:", error);
          alert("Error updating game. Check console for details.");
        }
      });
    
      // Delete button in edit mode remains unchanged.
      deleteButton.addEventListener("click", async () => {
        const confirmMessage = "⚠️ WARNING: Deleting this game will remove it from the database. Are you sure you want to proceed?";
        if (confirm(confirmMessage)) {
          try {
            const response = await fetch(METADATA_API, {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: editID })
            });
            if (response.ok) {
              alert("Game deleted successfully!");
              window.location.href = "admin_panel.html";
            } else {
              alert("Failed to delete game.");
            }
          } catch (error) {
            console.error("Error deleting game:", error);
            alert("Error deleting game. Check console for details.");
          }
        } else {
          alert("Deletion aborted.");
        }
      });
    
    } else {
      // Add mode: hide delete button.
      pageTitle.textContent = "Game Page - Add Game";
      deleteButton.style.display = "none";
    
      // In add mode, on form submission, post CSV data then check for images.
      gameForm.addEventListener("submit", async e => {
        e.preventDefault();
        const payload = {
          Title: valueOrNull("title"),
          DescriptionS: valueOrNull("descriptionS"),
          DescriptionL: valueOrNull("descriptionL"),
          "Genre Tags": Array.from(document.querySelectorAll('input[name="genre"]:checked')).map(el => el.value).join("|") || null,
          "Release Date": document.getElementById("releaseDate").value.trim() || null,
          Platform: Array.from(document.querySelectorAll('input[name="console"]:checked')).map(el => el.value).join("|") || null,
          "Developer/Publisher": valueOrNull("devPub"),
          Age: valueOrNull("ageRating"),
          Rating: valueOrNull("rating"),
          "Average Completion Time": valueOrNull("completionTime"),
          Trailer: valueOrNull("trailer")
        };
        
        try {
          const response = await fetch(METADATA_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            const result = await response.json();
            const newGameID = result.game.ID;
            // After adding the game, check for images.
            await uploadImages(newGameID);
            alert("Game added successfully!");
            gameForm.reset();
          } else {
            alert("Failed to add game.");
          }
        } catch (error) {
          console.error("Error adding game:", error);
          alert("Error adding game. Check console for details.");
        }
      });
    }

    // Back button functionality
    document.getElementById("backIcon").addEventListener("click", () => {
      if (editID) {
        window.location.href = "game_page.html?id=${editID}"; // Redirect to the admin panel.
      } else {
        window.location.href = "index.html"; // Redirect to the main page.
      }
    });
  </script>  
</body>
</html>
