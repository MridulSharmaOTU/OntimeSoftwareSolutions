<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Angel - Maintenance</title>
    <style>
        @font-face {
            font-family: 'GodOfWar';
            src: url('fonts/GODOFWAR.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a; /* Almost black */
            font-family: 'GodOfWar', Arial, sans-serif;
            color: white;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #ff4d4d; /* Gothic red */
            font-size: 5em;
            text-shadow: 2px 2px 8px #000000; /* Gothic shadow */
        }
        img {
            max-width: 80%;
            height: auto;
            border: 3px solid #ff4d4d; /* Gothic red border */
            box-shadow: 0 0 10px #000000; /* Gothic shadow */
        }
        p {
            margin-top: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 8px #000000; /* Gothic shadow */
        }
        .audio-controls {
            margin-top: 20px;
        }
        button {
            font-size: 1em;
            padding: 10px;
            margin-top: 10px;
            background-color: #333333; /* Dark grey */
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #555555; /* Slightly lighter grey */
        }
        button.active {
            background-color: #111111; /* Darker grey, almost black */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alpha Project</h1>
        <img src="images/angel-image.png" alt="Angel Image">
        <p>Website under construction</p>
        <div class="audio-controls">
            <audio id="background-music" src="sounds/music/angel-music-1.mp3" loop></audio>
            <button id="toggle-music" onclick="toggleMusic()">Play/Pause Music</button>
            <button onclick="changeVolume(0.1)">Volume Up</button>
            <button onclick="changeVolume(-0.1)">Volume Down</button>
            <button onclick="toggleNextTrack()">Next Track</button>
            <button id="toggle-loop" onclick="toggleLoop()">Loop</button>
        </div>
    </div>
    <script>
        const audio = document.getElementById('background-music');
        const toggleMusicBtn = document.getElementById('toggle-music');
        const toggleLoopBtn = document.getElementById('toggle-loop');
        const tracks = ["sounds/music/angel-music-1.mp3", 
            "sounds/music/angel-music-2.mp3",
            "sounds/music/angel-music-3.mp3",
            "sounds/music/angel-music-4.mp3",
            "sounds/music/angel-music-5.mp3",
            "sounds/music/angel-music-6.mp3",
            "sounds/music/angel-music-7.mp3",
            "sounds/music/angel-music-8.mp3"];
        let currentTrack = 0;

        // Event listener for when the track ends
        audio.addEventListener('ended', function() {
            toggleNextTrack();
        });

        // Function to switch to the next track
        function toggleNextTrack() {
            currentTrack = (currentTrack + 1) % tracks.length;
            audio.src = tracks[currentTrack];
            audio.play();
        }

        // Function to play/pause music
        function toggleMusic() {
            audio.muted = !audio.muted;
            toggleMusicBtn.classList.toggle('active', !audio.muted);
            if (!audio.muted) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // Function to change volume
        function changeVolume(delta) {
            audio.volume = Math.min(1, Math.max(0, audio.volume + delta));
        }

        // Function to toggle loop
        function toggleLoop() {
            audio.loop = !audio.loop;
            toggleLoopBtn.classList.toggle('active', audio.loop);
        }
    </script>
</body>
</html>
